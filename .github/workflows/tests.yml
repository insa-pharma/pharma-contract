name: tests

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Schémas JSON
        working-directory: contrat/schemas
        run: python test_schemas.py && python test_pollers.py
      - name: Simulateur Modbus
        working-directory: sim/modbus
        run: python test_sim_modbus.py
